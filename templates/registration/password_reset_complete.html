{% extends "patients/base.html" %}
{% block title %}Password Updated | Peptic Ulcer Disease{% endblock %}
{% block content %}
<main class="page auth-page">
  <section class="logged-out-panel verify-panel reveal">
    <p class="eyebrow"><i data-lucide="check-circle-2"></i> Password Updated</p>
    <h1>Password reset successful</h1>
    <p class="lead">Your account password has been updated. You can now log in with the new password.</p>
    <div class="button-row">
      <a class="btn" href="{% url 'login' %}"><i data-lucide="log-in"></i> Login</a>
    </div>
  </section>
</main>
{% endblock %}
