{% extends "patients/base.html" %}
{% block title %}Logged Out | PUDPredict{% endblock %}
{% block content %}
<main class="page auth-page">
  <section class="page-hero logged-out-panel reveal">
    <p class="eyebrow"><i data-lucide="shield"></i> Session Ended</p>

  </section>
</main>
{% endblock %}
